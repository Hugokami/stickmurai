<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 88" width="160" height="88" fill="none">
  <defs>
    <linearGradient id="crimsonSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="60%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="160" height="88" rx="6" fill="#0e0709"/>
  <rect width="158" height="86" x="1" y="1" rx="5" fill="none" stroke="rgba(255, 30, 39, 0.25)" stroke-width="1"/>
  
  <!-- Ground Line -->
  <line x1="8" y1="74" x2="152" y2="74" stroke="rgba(255, 30, 39, 0.25)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Sweeping Crescent Blade Arc -->
  <path d="M 88 10 C 138 14 156 46 122 74 C 144 50 132 24 88 10 Z" fill="url(#crimsonSlash)" filter="url(#crimsonGlow)"/>
  <path d="M 82 14 C 130 18 148 48 116 72" fill="none" stroke="#ff1744" stroke-width="2.5" filter="url(#crimsonGlow)"/>
  <path d="M 94 8 C 142 14 160 46 126 76" fill="none" stroke="#ff8a80" stroke-width="1.2"/>

  <!-- Flying Embers / Sparks -->
  <circle cx="144" cy="28" r="1.8" fill="#ffd200" filter="url(#crimsonGlow)"/>
  <circle cx="138" cy="54" r="1.5" fill="#ff1744"/>
  <circle cx="150" cy="42" r="2" fill="#ff5252" filter="url(#crimsonGlow)"/>
  <circle cx="128" cy="18" r="1.5" fill="#ffd200"/>
  <circle cx="108" cy="76" r="1.2" fill="#ff8a80"/>

  <!-- Stickman Lunging Slasher -->
  <!-- Head -->
  <circle cx="68" cy="32" r="6" fill="#ffffff"/>
  <!-- Torso (deep forward combat lunge) -->
  <line x1="68" y1="38" x2="80" y2="54" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword Arm swinging forward -->
  <line x1="72" y1="42" x2="94" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="38" x2="114" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="94" y1="38" x2="132" y2="28" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" filter="url(#crimsonGlow)"/>
  <!-- Off Hand back -->
  <line x1="72" y1="42" x2="56" y2="48" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Front Leg deep knee bend -->
  <line x1="80" y1="54" x2="100" y2="62" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="62" x2="114" y2="74" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Back Extended Leg -->
  <line x1="80" y1="54" x2="58" y2="64" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="64" x2="38" y2="74" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>