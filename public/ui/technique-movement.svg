<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 88" width="160" height="88" fill="none">
  <defs>
    <linearGradient id="moveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>
    <filter id="cyanBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="160" height="88" rx="6" fill="#080c14"/>
  <rect width="158" height="86" x="1" y="1" rx="5" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
  
  <!-- Ground Track Line -->
  <line x1="8" y1="72" x2="152" y2="72" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Speed Motion Trails -->
  <path d="M 16 38 L 78 38" stroke="url(#moveGlow)" stroke-width="2" stroke-linecap="round" filter="url(#cyanBlur)"/>
  <path d="M 28 48 L 92 48" stroke="url(#moveGlow)" stroke-width="2.5" stroke-linecap="round" filter="url(#cyanBlur)"/>
  <path d="M 12 58 L 72 58" stroke="url(#moveGlow)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 38 28 L 82 28" stroke="url(#moveGlow)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Motion Direction Swoosh Arc -->
  <path d="M 30 74 Q 90 80 148 72" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#cyanBlur)"/>
  <polygon points="152,72 144,68 146,74" fill="#00e5ff"/>

  <!-- Stickman Runner Silhouette -->
  <!-- Head -->
  <circle cx="108" cy="26" r="6" fill="#ffffff" filter="url(#cyanBlur)"/>
  <!-- Torso -->
  <line x1="108" y1="32" x2="94" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Back Arm -->
  <line x1="104" y1="38" x2="88" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="42" x2="80" y2="52" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Front Arm & Katana Hilt -->
  <line x1="104" y1="38" x2="120" y2="42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="42" x2="132" y2="36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="42" x2="148" y2="38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#cyanBlur)"/>
  <!-- Front Leg -->
  <line x1="94" y1="50" x2="114" y2="60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="114" y1="60" x2="128" y2="72" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Back Trailing Leg -->
  <line x1="94" y1="50" x2="74" y2="58" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="58" x2="56" y2="64" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>